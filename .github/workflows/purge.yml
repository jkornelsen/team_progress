# .github/workflows/purge.yml
name: Scheduled purge
on:
  schedule:
    - cron: '0 6,18 * * *'   # twice a day, 6am and 6pm UTC
  workflow_dispatch:          # lets you trigger it manually from the Actions tab too
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit purge endpoint
        run: |
          curl -sf -X POST https://teamprogress.pythonanywhere.com/session/purge \
            -H "Authorization: Bearer ${{ secrets.PURGE_TOKEN }}"
